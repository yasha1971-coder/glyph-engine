name: research-semantic-candidate-discovery-v1
run-name: "RESEARCH — BGE-M3 semantic candidate experiment"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-candidate-discovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Personal Vault corpus
        run: bash experiments/personal_vault_v0/fetch_corpora.sh /tmp/pv0-input
      - name: Install pinned hybrid retrieval dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            'FlagEmbedding==1.3.5' 'numpy==2.1.3'
      - name: Run BGE-M3 hybrid semantic candidate experiment
        run: |
          python3 experiments/personal_vault_v0/semantic_candidate_discovery_v1.py /tmp/pv0-input \
            --model BAAI/bge-m3
