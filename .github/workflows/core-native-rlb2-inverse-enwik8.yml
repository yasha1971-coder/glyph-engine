name: core-native-rlb2-inverse-enwik8-100mb

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_inverse_rlb2.cpp
      - experiments/loc_text_ef_v0/native_inverse_enwik8_gate.py
      - .github/workflows/core-native-rlb2-inverse-enwik8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-100mb-independent-byte-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build original frozen canonical SA and BWT binary targets
        run: |
          cmake -S reference -B reference/build
          cmake --build reference/build --target build_sa_binary_v1 build_bwt_binary_v1 -j2
      - name: Build independent native RLB2-only inverse BWT
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            research/experiments/loc_text_ef_v0/native_inverse_rlb2.cpp \
            -o "$RUNNER_TEMP/gl-native-inverse-rlb2"
      - name: Rebuild pinned RLB2/RLR2, remove source/SA/BWT then restore enwik8
        run: |
          python3 research/experiments/loc_text_ef_v0/native_inverse_enwik8_gate.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --native "$RUNNER_TEMP/gl-native-inverse-rlb2" \
            --output "$RUNNER_TEMP/native-enwik8-inverse-$GITHUB_RUN_ID"
      - name: Show compact evidence on every outcome
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/native-enwik8-inverse-$GITHUB_RUN_ID/result.json"; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k:d.get(k) for k in ("status","error","recovery_bytes","recovery_sha256","native_wall_seconds","native_peak_rss_kb","retained_exact_search_rank_bytes","hostile_corrupt_rlb2_rejected","limitations")},indent=2))' "$RUNNER_TEMP/native-enwik8-inverse-$GITHUB_RUN_ID/result.json"
          fi
      - name: Upload only bounded reports, never 100MB data/index/SA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-native-100mb-self-index-inversion-evidence
          path: |
            ${{ runner.temp }}/native-enwik8-inverse-${{ github.run_id }}/result.json
            ${{ runner.temp }}/native-enwik8-inverse-${{ github.run_id }}/commands.json
          retention-days: 30
          if-no-files-found: warn
