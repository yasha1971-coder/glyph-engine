name: core-real-composition-external-oracle

on:
  push:
    branches:
      - codex/glyph-core-frontier-g0-20261105
    paths:
      - experiments/core_convergence_v1/real_operator_comparable_gate.py
      - .github/workflows/core-real-composition-external-oracle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparable-real-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: 81628f843dc8aa633c65594a66d2386bfc3cb5c2
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install external CRoaring reference (research job only)
        run: python -m pip install pyroaring==1.2.0
      - name: Verify reference source identity and native toolchain
        run: |
          test "$(git -C reference rev-parse HEAD)" = 81628f843dc8aa633c65594a66d2386bfc3cb5c2
          cmake --version
          g++ --version
          python3 -c "import pyroaring; print('CRoaring Python bridge available')"
      - name: Build original pinned binary-safe SA/BWT/FM operator
        run: |
          cmake -S reference -B reference/build
          cmake --build reference/build --target build_sa_binary_v1 build_bwt_binary_v1 build_fm_binary_v1 query_fm_locate_binary_v1 -j2
      - name: Real 3-block composition versus independent oracle and CRoaring
        run: |
          python3 research/experiments/core_convergence_v1/real_operator_comparable_gate.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --workdir "$RUNNER_TEMP/glyph-comparable-$GITHUB_RUN_ID"
      - name: Upload only experimental result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-real-operator-comparable-result
          path: ${{ runner.temp }}/glyph-comparable-${{ github.run_id }}/result.json
          if-no-files-found: warn
          retention-days: 30
