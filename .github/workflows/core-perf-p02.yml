name: core-perf-p02-shared-authenticated-read

on:
  push:
    branches:
      - codex/core-l10-append-replay-20261106
    paths:
      - experiments/core_perf_research_v0/batch_pass_v0.py
      - experiments/core_perf_research_v0/p02_gate.py
      - experiments/core_perf_research_v0/BatchCrossingProof.lean
      - experiments/core_perf_research_v0/P02_*
      - .github/workflows/core-perf-p02.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p02-mixed-length-and-hostiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pin unchanged P01 and L9 baseline
        run: |
          test "$(git -C research hash-object experiments/core_l9_scale_v0/verifier.py)" = "e0a4c660daa5185dd218e840a5356fceb73c61e5"
          test "$(git -C research hash-object experiments/core_perf_research_v0/one_pass_scan.py)" = "56245f51a2dd0c4b17fb018d277b5222096448f9"
      - name: Compare batch with independent byte oracle and one-pattern P01
        run: |
          python3 research/experiments/core_perf_research_v0/p02_gate.py \
            --one-pass research/experiments/core_perf_research_v0/one_pass_scan.py \
            --batch research/experiments/core_perf_research_v0/batch_pass_v0.py \
            --mode safety --output "$RUNNER_TEMP/perf-p02-safety"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1]));assert x["status"]=="P02_EXACT_SAFETY_PASS" and x["oracle_cases"]>=1500 and x["hostile_count"]==16,x;print("P02_MIXED_LENGTH_AND_16_HOSTILES_PASS")' \
            "$RUNNER_TEMP/perf-p02-safety/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02-safety-report
          path: ${{ runner.temp }}/perf-p02-safety/result.json
          retention-days: 30
          if-no-files-found: ignore

  p02-100mb-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pin unchanged P01 comparator
        run: |
          test "$(git -C research hash-object experiments/core_l9_scale_v0/verifier.py)" = "e0a4c660daa5185dd218e840a5356fceb73c61e5"
      - name: Paired profile Q=1,2,4,8,16 on canonical SHA-pinned enwik8
        run: |
          python3 research/experiments/core_perf_research_v0/p02_gate.py \
            --one-pass research/experiments/core_perf_research_v0/one_pass_scan.py \
            --batch research/experiments/core_perf_research_v0/batch_pass_v0.py \
            --mode enwik8 --output "$RUNNER_TEMP/perf-p02-100mb"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1]));assert x["status"]=="P02_100MB_EXACT_BENCH_PASS" and x["source_bytes"]==100000000 and set(x["summary"])=={"1","2","4","8","16"},x;print("P02_100MB_PAIRED_EXACT_PASS");print(json.dumps(x["summary"],sort_keys=True,indent=2))' \
            "$RUNNER_TEMP/perf-p02-100mb/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02-100mb-measured-ratios
          path: ${{ runner.temp }}/perf-p02-100mb/result.json
          retention-days: 30
          if-no-files-found: ignore

  p02-mathlib-carry-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 1ccd71f89cbbd82ae7d097723ce1722ca7b01c33
          path: mathlib
          persist-credentials: false
      - name: Pin Mathlib proof environment
        run: |
          test "$(git -C mathlib rev-parse HEAD)" = "1ccd71f89cbbd82ae7d097723ce1722ca7b01c33"
          test "$(cat mathlib/lean-toolchain)" = "leanprover/lean4:v4.25.0"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: mathlib
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Kernel-check five mixed-length arithmetic lemmas
        working-directory: mathlib
        run: |
          lake env lean "$GITHUB_WORKSPACE/research/experiments/core_perf_research_v0/BatchCrossingProof.lean"
          echo "P02_MIXED_LENGTH_CARRY_LEAN_THEOREMS_CHECKED"
