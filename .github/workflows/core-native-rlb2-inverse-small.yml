name: core-native-rlb2-inverse-small

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_inverse_rlb2.cpp
      - experiments/loc_text_ef_v0/native_rlb2_smoke_gate.py
      - .github/workflows/core-native-rlb2-inverse-small.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-inverse-and-hostiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile independent native self-inverse implementation
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            research/experiments/loc_text_ef_v0/native_inverse_rlb2.cpp \
            -o "$RUNNER_TEMP/gl-native-inverse-rlb2"
      - name: Verify original 24-byte binary source and hostile rejections
        run: |
          python3 research/experiments/loc_text_ef_v0/native_rlb2_smoke_gate.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --binary "$RUNNER_TEMP/gl-native-inverse-rlb2" \
            --output "$RUNNER_TEMP/gl-native-inverse-small-$GITHUB_RUN_ID"
      - name: Upload only small JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-rlb2-native-inverse-smoke-receipt
          path: ${{ runner.temp }}/gl-native-inverse-small-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
