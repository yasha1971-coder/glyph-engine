name: core-l7-streaming-small-exact-and-hostile

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_run_stream_inverse_rlb2_ef.cpp
      - experiments/loc_text_ef_v0/native_run_interval_inverse_rlb2_ef.cpp
      - .github/workflows/core-l7-streaming-small.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-windows-without-resident-full-output:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile bounded-output streaming inverse
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pthread \
            research/experiments/loc_text_ef_v0/native_run_stream_inverse_rlb2_ef.cpp \
            -o "$RUNNER_TEMP/glyph-native-streamed-inverse"
      - name: Verify 18 exact source reconstructions and three hostile cases
        run: |
          python3 research/experiments/loc_text_ef_v0/native_parallel_windows_smoke.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --binary "$RUNNER_TEMP/glyph-native-streamed-inverse" \
            --output "$RUNNER_TEMP/glyph-l7-small-$GITHUB_RUN_ID"
      - name: Preserve only bounded receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-l7-small-streamed-output-receipt
          path: ${{ runner.temp }}/glyph-l7-small-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
