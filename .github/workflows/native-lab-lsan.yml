name: Native Lab leak gate
on:
  pull_request:
    paths:
      - 'native-lab/**'
      - '.github/workflows/native-lab-lsan.yml'
permissions:
  contents: read
jobs:
  leak-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev zlib1g-dev
      - name: Leak controls and complete native lab suite
        working-directory: native-lab
        run: bash ci.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-lab-sanitizers-${{ github.event.pull_request.head.sha }}
          path: native-lab/evidence/
          if-no-files-found: error
