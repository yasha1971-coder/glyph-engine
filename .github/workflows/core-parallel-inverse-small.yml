name: core-parallel-inverse-small

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_parallel_inverse_rlb2_ef.cpp
      - experiments/loc_text_ef_v0/native_parallel_windows_smoke.py
      - .github/workflows/core-parallel-inverse-small.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-safe-independent-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile parallel native inverse with pthread
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pthread \
            research/experiments/loc_text_ef_v0/native_parallel_inverse_rlb2_ef.cpp \
            -o "$RUNNER_TEMP/glyph-parallel-inverse"
      - name: Verify all windows, input formats, and hostile rejection
        run: |
          python3 research/experiments/loc_text_ef_v0/native_parallel_windows_smoke.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --binary "$RUNNER_TEMP/glyph-parallel-inverse" \
            --output "$RUNNER_TEMP/native-small-parallel-$GITHUB_RUN_ID"
      - name: Upload bounded JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-parallel-inverse-small-evidence
          path: ${{ runner.temp }}/native-small-parallel-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
