name: core-lf-text-ef-real-rankv2-parity

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/rank_v2_ef_runtime_gate.py
      - experiments/loc_text_ef_v0/query_ef_research.py
      - .github/workflows/core-lf-text-ef-real-rankv2-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rlb2-rlr2-locate-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Execute real frozen RankV2 with physical Elias–Fano locate
        run: |
          python3 research/experiments/loc_text_ef_v0/rank_v2_ef_runtime_gate.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --output "$RUNNER_TEMP/rank-lf-ef-$GITHUB_RUN_ID"
      - name: Upload only bounded evidence, never build corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-lf-ef-real-rankv2-parity
          path: ${{ runner.temp }}/rank-lf-ef-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
