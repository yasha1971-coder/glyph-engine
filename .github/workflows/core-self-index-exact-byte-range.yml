name: core-self-index-exact-byte-range

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/self_index_exact_range_extractor.py
      - .github/workflows/core-self-index-exact-byte-range.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bounded-range-binary-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Exhaust all byte ranges with real RLB2/RLR2 and Elias-Fano samples
        run: |
          python3 research/experiments/loc_text_ef_v0/self_index_exact_range_extractor.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --output "$RUNNER_TEMP/verified-exact-ranges-$GITHUB_RUN_ID"
      - name: Upload only bounded receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-self-index-random-range-extract-receipt
          path: ${{ runner.temp }}/verified-exact-ranges-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
