name: personal-vault-v0-closed-loop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/personal_vault_v0/**'
      - '.github/workflows/personal-vault-v0-closed-loop.yml'
permissions:
  contents: read
jobs:
  closed-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast Human Intent preflight
        run: |
          bash experiments/personal_vault_v0/fetch_corpora.sh /tmp/pv0-preflight-input
          python3 experiments/personal_vault_v0/human_intent_preflight.py /tmp/pv0-preflight-input --out /tmp/human-intent-preflight.json
      - name: Run fast GLYPH Personal Vault V0 kernel loop
        run: bash experiments/personal_vault_v0/run_kernel_v0_fast.sh /tmp/pv0
      - name: Gate object-aware RLB3X query semantics
        run: python3 experiments/personal_vault_v0/object_aware_gate.py /tmp/pv0
      - name: Gate Human Intent V0 fixed-plan evidence
        run: python3 experiments/personal_vault_v0/human_intent_gate.py /tmp/pv0
      - name: Gate external LLM planner replay without oracle leakage
        run: python3 experiments/personal_vault_v0/external_llm_planner_gate.py /tmp/pv0
      - name: Gate oracle-free AI to GLYPH bridge contract
        run: python3 experiments/personal_vault_v0/ai_glyph_bridge_gate_v0.py /tmp/pv0
      - name: Gate two-turn clarification dialogue
        run: python3 experiments/personal_vault_v0/dialogue_clarification_gate_v0.py
      - name: Gate external LLM generated second-turn replay
        run: python3 experiments/personal_vault_v0/dialogue_llm_replay_gate_v1.py
      - name: Gate strict planner protocol and oracle boundary
        run: python3 experiments/personal_vault_v0/planner_protocol_gate_v0.py
      - name: Gate frozen 50-question Blind Memory V1 baseline
        run: python3 experiments/personal_vault_v0/blind_memory_gate_v1.py /tmp/pv0
      - name: Gate second-pass resolution of frozen Blind Memory V1 unresolved cases
        run: python3 experiments/personal_vault_v0/blind_memory_resolution_gate_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: personal-vault-v0-report
          path: |
            /tmp/human-intent-preflight.json
            /tmp/pv0/kernel-v0-size.json
            /tmp/pv0/kernel-v0-manifest.json
            /tmp/pv0/objects.json
            /tmp/pv0/queries.json
            /tmp/pv0/boundaries.json
            /tmp/pv0/object-aware-gate.json
            /tmp/pv0/human-intent-gate.json
            /tmp/pv0/external-llm-planner-gate.json
            /tmp/pv0/ai-glyph-bridge-gate.json
            /tmp/pv0/dialogue-clarification-gate.json
            /tmp/pv0/dialogue-llm-replay-gate.json
            /tmp/pv0/planner-protocol-gate.json
            /tmp/pv0/blind-memory-gate-v1.json
            /tmp/pv0/blind-memory-resolution-gate.json
