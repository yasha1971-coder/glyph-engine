name: research-local-cognitive-router-v3
run-name: "RESEARCH — cognitive router v3"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-first-router:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build GLYPH kernel fixture
        run: bash experiments/personal_vault_v0/run_kernel_v0_fast.sh /tmp/pv0
      - name: Build pinned llama.cpp completion binary
        run: |
          git clone --quiet https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout --quiet 010be9683afabe14ce299197b38c329f94bae568
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build --target llama-completion -j2
      - name: Download pinned Liquid LFM2.5 1.2B Q4_K_M
        run: |
          mkdir -p /tmp/models
          curl -L --fail --retry 3 \
            -o /tmp/models/lfm2.5-1.2b-q4_k_m.gguf \
            https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
          echo 'b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5  /tmp/models/lfm2.5-1.2b-q4_k_m.gguf' | sha256sum -c -
      - name: Gate evidence-first cognitive router
        run: |
          python3 experiments/personal_vault_v0/local_cognitive_router_gate_v3.py /tmp/pv0 \
            --llama-cli /tmp/llama.cpp/build/bin/llama-completion \
            --model /tmp/models/lfm2.5-1.2b-q4_k_m.gguf \
            --model-label LiquidAI/LFM2.5-1.2B-Instruct-Q4_K_M
