name: core-parallel-inverse-enwik8-100mb

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_parallel_enwik8_gate.py
      - experiments/loc_text_ef_v0/native_parallel_inverse_rlb2_ef.cpp
      - .github/workflows/core-parallel-inverse-enwik8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-100mb-parallel-bwt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build historical canonical 100MB SA and BWT tools
        run: |
          cmake -S reference -B reference/build
          cmake --build reference/build --target build_sa_binary_v1 build_bwt_binary_v1 -j2
      - name: Build original research serial and new parallel independent decoders
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pthread \
            research/experiments/loc_text_ef_v0/native_inverse_rlb2.cpp \
            -o "$RUNNER_TEMP/gl-native-sequential"
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pthread \
            research/experiments/loc_text_ef_v0/native_parallel_inverse_rlb2_ef.cpp \
            -o "$RUNNER_TEMP/gl-native-parallel"
      - name: Execute exact canonical 100MB SHA comparison with 1T 2T 4T
        run: |
          python3 research/experiments/loc_text_ef_v0/native_parallel_enwik8_gate.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --sequential "$RUNNER_TEMP/gl-native-sequential" \
            --parallel "$RUNNER_TEMP/gl-native-parallel" \
            --output "$RUNNER_TEMP/gl-parallel-enwik8-$GITHUB_RUN_ID"
      - name: Show status and per-mode performance if accepted
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gl-parallel-enwik8-$GITHUB_RUN_ID/result.json"; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k:d.get(k) for k in ("status","error","source_bytes","retained_single_index_bytes","ef_sample_records_verified","cases","limits")},indent=2))' "$RUNNER_TEMP/gl-parallel-enwik8-$GITHUB_RUN_ID/result.json"
          fi
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-enwik8-native-parallel-inverse-evidence
          path: |
            ${{ runner.temp }}/gl-parallel-enwik8-${{ github.run_id }}/result.json
            ${{ runner.temp }}/gl-parallel-enwik8-${{ github.run_id }}/commands.json
          retention-days: 30
          if-no-files-found: warn
