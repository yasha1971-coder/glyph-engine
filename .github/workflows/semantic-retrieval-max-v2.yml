name: semantic-retrieval-max-v2
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/personal_vault_v0/semantic_retrieval_max_v2.py'
      - '.github/workflows/semantic-retrieval-max-v2.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Personal Vault corpus
        run: bash experiments/personal_vault_v0/fetch_corpora.sh /tmp/pv0-input
      - name: Install retrieval stack
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            'sentence-transformers==5.1.0' \
            'transformers==4.57.6' \
            'torch==2.13.0' \
            'numpy==2.1.3'
      - name: Gate one-shot frontier retrieval stack
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python3 experiments/personal_vault_v0/semantic_retrieval_max_v2.py /tmp/pv0-input
