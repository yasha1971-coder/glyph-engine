name: semantic-retrieval-max-v2
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/personal_vault_v0/semantic_retrieval_max_v2.py'
      - '.github/workflows/semantic-retrieval-max-v2.yml'
permissions:
  contents: read
jobs:
  semantic-retrieval-max:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Personal Vault corpus
        run: bash experiments/personal_vault_v0/fetch_corpora.sh /tmp/pv0-input
      - name: Install retrieval stack
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            'sentence-transformers==5.1.0' \
            'transformers==4.57.6' \
            'torch==2.13.0' \
            'numpy==2.1.3' \
            'einops==0.8.1'
      - name: Gate maximal multilingual semantic candidate discovery
        run: |
          python3 experiments/personal_vault_v0/semantic_retrieval_max_v2.py /tmp/pv0-input \
            --embed-model jinaai/jina-embeddings-v5-text-small \
            --reranker jinaai/jina-reranker-v3.5 | tee /tmp/semantic-retrieval-max-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-retrieval-max-v2-report
          path: /tmp/semantic-retrieval-max-v2.json
