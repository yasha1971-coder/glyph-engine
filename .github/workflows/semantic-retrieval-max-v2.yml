name: research-semantic-retrieval-max-v2
run-name: "RESEARCH — maximal semantic retrieval v2"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-retrieval-max:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen Personal Vault corpus
        run: bash experiments/personal_vault_v0/fetch_corpora.sh /tmp/pv0-input
      - name: Install retrieval stack
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            'sentence-transformers==5.1.2' \
            'transformers==4.57.6' \
            'torch==2.13.0' \
            'numpy==2.1.3' \
            'einops==0.8.1' \
            'peft==0.17.1'
      - name: Run maximal multilingual semantic candidate discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/personal_vault_v0/semantic_retrieval_max_v2.py /tmp/pv0-input \
            --embed-model jinaai/jina-embeddings-v5-text-small \
            --reranker jinaai/jina-reranker-v3.5 | tee /tmp/semantic-retrieval-max-v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/semantic-retrieval-max-v2.json'))
          assert d.get('format')=='GLYPH_SEMANTIC_RETRIEVAL_MAX_V2', d
          assert d.get('all_checks_passed') is True, d
          print('SEMANTIC_MAX_V2_REPORT_OK', d['recall_at_1'], d['recall_at_5'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-retrieval-max-v2-report
          path: /tmp/semantic-retrieval-max-v2.json
