name: core-l6-run-interval-small

on:
  push:
    branches:
      - codex/glyph-lf-bound-loc3-ef-research-20261105
    paths:
      - experiments/loc_text_ef_v0/native_run_interval_inverse_rlb2_ef.cpp
      - experiments/loc_text_ef_v0/native_parallel_inverse_rlb2_ef.cpp
      - .github/workflows/core-l6-run-interval-small.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-safe-run-interval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: yasha1971-coder/glyph-engine
          ref: c33cb493bc75f13ee4a904fabb190a29a196c94b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile run-interval O(r) predecessor prototype
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pthread \
            research/experiments/loc_text_ef_v0/native_run_interval_inverse_rlb2_ef.cpp \
            -o "$RUNNER_TEMP/glyph-run-interval-inverse"
      - name: Byte-exact 2/3/5 text sampling, 1/2/4 threads, all hostiles
        run: |
          python3 research/experiments/loc_text_ef_v0/native_parallel_windows_smoke.py \
            --reference "$GITHUB_WORKSPACE/reference" \
            --binary "$RUNNER_TEMP/glyph-run-interval-inverse" \
            --output "$RUNNER_TEMP/core-l6-small-$GITHUB_RUN_ID"
      - name: Retain bounded JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyph-l6-small-run-interval-receipt
          path: ${{ runner.temp }}/core-l6-small-${{ github.run_id }}/result.json
          retention-days: 30
          if-no-files-found: warn
